<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
    <linearGradient id="glyphGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CFB"/>
      <stop offset="100%" stop-color="#F45FD1"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
    </filter>
  </defs>

  <!-- Background: app's own dark navy -->
  <g clip-path="url(#squircle-clip)">
    <rect width="512" height="512" fill="#0B0A14"/>
    <rect width="512" height="512" fill="url(#glyphGradient)" opacity="0.06"/>
  </g>

  <!-- Glow layer (blurred duplicate) -->
  <g filter="url(#glow)" opacity="0.55">
    <circle cx="222" cy="182" r="46" fill="url(#glyphGradient)"/>
    <path d="M 138 322 C 138 254 178 216 234 216 C 268 216 296 232 312 258 L 268 302 C 258 288 246 280 230 280 C 202 280 182 300 182 328 L 182 340 L 138 340 Z" fill="url(#glyphGradient)"/>
    <path d="M 160 292 L 210 342 L 340 176" fill="none" stroke="url(#glyphGradient)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(318,278)">
      <rect x="0" y="14" width="88" height="76" rx="14" fill="url(#glyphGradient)"/>
      <rect x="16" y="0" width="12" height="28" rx="6" fill="url(#glyphGradient)"/>
      <rect x="60" y="0" width="12" height="28" rx="6" fill="url(#glyphGradient)"/>
    </g>
  </g>

  <!-- Crisp foreground -->
  <circle cx="222" cy="182" r="46" fill="url(#glyphGradient)"/>
  <path d="M 138 322 C 138 254 178 216 234 216 C 268 216 296 232 312 258 L 268 302 C 258 288 246 280 230 280 C 202 280 182 300 182 328 L 182 340 L 138 340 Z" fill="url(#glyphGradient)"/>
  <path d="M 160 292 L 210 342 L 340 176" fill="none" stroke="url(#glyphGradient)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(318,278)">
    <rect x="0" y="14" width="88" height="76" rx="14" fill="#0B0A14" stroke="url(#glyphGradient)" stroke-width="8"/>
    <rect x="16" y="0" width="12" height="28" rx="6" fill="url(#glyphGradient)"/>
    <rect x="60" y="0" width="12" height="28" rx="6" fill="url(#glyphGradient)"/>
    <line x1="16" y1="46" x2="72" y2="46" stroke="url(#glyphGradient)" stroke-width="8" stroke-linecap="round"/>
    <line x1="16" y1="68" x2="56" y2="68" stroke="url(#glyphGradient)" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
